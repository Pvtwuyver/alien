name: Fetch TMDB posters

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 1 * *"   # eenmaal per maand, ter controle op gewijzigde TMDB-links

permissions:
  contents: write

jobs:
  fetch-posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Posterlinks ophalen bij TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node scripts/fetch-posters.mjs

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/films.json
          git diff --staged --quiet || git commit -m "Posterlinks bijgewerkt via TMDB"
          git push
